name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: |
          npm install
          npm install --legacy-peer-deps @capacitor-community/text-to-speech@^5.0.0 || echo "tts plugin skipped"
          npm install --legacy-peer-deps @capacitor-community/speech-recognition@^6.0.0 || echo "speech plugin skipped"

      - name: Create Android project
        run: npx cap add android

      - name: Prepare manifest (microphone + speech services)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n    </queries>\n</manifest>#' "$M"
          cat "$M"

      - name: Sync web files
        run: npx cap sync android

      - name: Fixed signing key (same signature for every build)
        run: |
          mkdir -p "$HOME/.android"
          echo "" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | head -5

      - name: Build debug APK
        run: |
          build() { (cd android && chmod +x gradlew && ./gradlew assembleDebug); }
          if ! build; then
            echo "Build failed; retrying without the speech-recognition plugin"
            npm uninstall @capacitor-community/speech-recognition || true
            npx cap sync android
            if ! build; then
              echo "Build failed again; retrying without the text-to-speech plugin"
              npm uninstall @capacitor-community/text-to-speech || true
              npx cap sync android
              build
            fi
          fi

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Agaa-English.apk

      - name: Inspect APK (diagnostics)
        continue-on-error: true
        run: |
          ls -l Agaa-English.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/aapt2" dump badging Agaa-English.apk | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission" || true
          "$BT/apksigner" verify --verbose Agaa-English.apk | head -8 || true

      - uses: actions/upload-artifact@v4
        with:
          name: agaa-english-apk
          path: Agaa-English.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Agaa-English.apk \
            --title "Agaa English v${{ github.run_number }}" \
            --notes "ملف التثبيت: Agaa-English.apk"
            
