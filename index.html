<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Agaa English</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#ffffff;--surface2:#eef1f5;--text:#14181f;--muted:#5d6675;--line:#d9dee6;
  --primary:#0f766e;--on-primary:#ffffff;--tonal:#d5efeb;--good:#2e7d32;--good-bg:#d8efd9;--bad:#c62828;--bad-bg:#f8d9d9;--warn:#b26a00;
}
:root[data-theme="dark"]{
  --bg:#0e1116;--surface:#171b22;--surface2:#222831;--text:#e8ebf0;--muted:#9aa4b3;--line:#2c333d;
  --primary:#4fd1c5;--on-primary:#06201d;--tonal:#16403c;--good:#7bd88a;--good-bg:#1d3a22;--bad:#ff8a80;--bad-bg:#43211f;--warn:#ffb74d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116;--surface:#171b22;--surface2:#222831;--text:#e8ebf0;--muted:#9aa4b3;--line:#2c333d;
    --primary:#4fd1c5;--on-primary:#06201d;--tonal:#16403c;--good:#7bd88a;--good-bg:#1d3a22;--bad:#ff8a80;--bad-bg:#43211f;--warn:#ffb74d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.5}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
.appbar{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.appbar h1{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;color:var(--text);font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--tonal);color:var(--text);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.content{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:7px 0 6px;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit}
.nav button span.i{font-size:20px;line-height:1.1}
.nav button.on{color:var(--primary);font-weight:700}
.nav button.on span.i{background:var(--tonal);border-radius:999px;padding:1px 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.tile{display:flex;align-items:center;gap:12px;cursor:pointer}
.tile:active{background:var(--surface2)}
.tile .av{width:38px;height:38px;border-radius:50%;background:var(--tonal);display:grid;place-items:center;font-weight:700;flex:none}
.tile .tx{flex:1;min-width:0}
.tile .t1{font-weight:700}
.tile .t2{color:var(--muted);font-size:13.5px}
.sec{color:var(--muted);font-size:13px;font-weight:700;margin:14px 4px 8px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px 18px;font-size:16px;font-weight:700;background:var(--primary);color:var(--on-primary);cursor:pointer;font-family:inherit;margin-top:8px}
.btn:disabled{opacity:.4;cursor:default}
.btn.tonal{background:var(--tonal);color:var(--text)}
.btn.outline{background:none;border:1.5px solid var(--primary);color:var(--primary)}
.btn.small{display:inline-block;width:auto;padding:8px 16px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.center{text-align:center}
.muted{color:var(--muted)}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.center.en{text-align:center}
.big{font-size:34px;font-weight:700}
.prog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transition:width .15s linear}
.opt{display:block;width:100%;text-align:center;padding:15px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:19px;cursor:pointer;font-family:inherit}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center}
.wchip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:10px;font-size:18px;cursor:pointer;font-family:inherit}
.wbox{min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:14px 0}
.bubble{max-width:82%;padding:9px 14px;border-radius:16px;margin:5px 0;font-size:17px;width:fit-content}
.bubble.them{background:var(--surface2);margin-right:auto}
.bubble.me{background:var(--tonal);margin-left:auto}
.bubble.me.ok{background:var(--good-bg)}
.bubble.me.no{background:var(--bad-bg)}
.note{background:var(--tonal);border-radius:12px;padding:10px;margin:6px 0;text-align:center;font-size:14.5px;white-space:pre-line}
.inputrow{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.inputrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:16px;background:var(--bg);color:var(--text);direction:ltr;font-family:inherit}
textarea.tr{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;background:var(--surface);color:var(--text);font-family:inherit;resize:vertical}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:19px;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--text);font-size:15px;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--tonal);border-color:var(--primary);font-weight:700}
.w-ok{color:var(--good)}.w-bad{color:var(--bad);text-decoration:underline}
.wrong{color:var(--bad);text-decoration:line-through}.right{color:var(--good);font-weight:700}
.heart{font-size:20px}
pre.explain{white-space:pre-wrap;font-family:inherit;margin:0;font-size:16.5px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {"lessons":{"lessons":[{"id":"b1","kind":"situation","level":"beginner","title":"التعارف","situation":"تقديم نفسك لشخص جديد","lines":[{"en":"Hello, my name is Sara.","ar":"مرحباً، اسمي سارة."},{"en":"Nice to meet you.","ar":"تشرفت بمعرفتك."},{"en":"I am from Sudan.","ar":"أنا من السودان."},{"en":"I am a student.","ar":"أنا طالبة."},{"en":"I live in Khartoum.","ar":"أسكن في الخرطوم."},{"en":"How are you?","ar":"كيف حالك؟"}],"exercises":[{"ar":"أنا من السودان","en":"I am from Sudan"},{"ar":"اسمي سارة","en":"My name is Sara"},{"ar":"أنا طالب","en":"I am a student"}]},{"id":"b2","kind":"situation","level":"beginner","title":"في المطعم","situation":"طلب الطعام ودفع الفاتورة","lines":[{"en":"A table for two, please.","ar":"طاولة لشخصين من فضلك."},{"en":"Can I see the menu?","ar":"هل يمكنني رؤية القائمة؟"},{"en":"I would like a chicken sandwich.","ar":"أريد ساندويتش دجاج."},{"en":"Do you have orange juice?","ar":"هل لديكم عصير برتقال؟"},{"en":"The food is very good.","ar":"الطعام لذيذ جداً."},{"en":"Can I have the bill, please?","ar":"هل يمكنني الحصول على الفاتورة من فضلك؟"}],"exercises":[{"ar":"أريد كوب ماء","en":"I would like a glass of water"},{"ar":"هل لديكم قهوة","en":"Do you have coffee"},{"ar":"هل يمكنني رؤية القائمة","en":"Can I see the menu"}]},{"id":"b3","kind":"situation","level":"beginner","title":"السؤال عن الطريق","situation":"الوصول إلى مكان ما","lines":[{"en":"Excuse me, where is the bank?","ar":"عفواً، أين البنك؟"},{"en":"Go straight.","ar":"اذهب مباشرة."},{"en":"Turn left at the corner.","ar":"انعطف يساراً عند الزاوية."},{"en":"It is near the market.","ar":"إنه قريب من السوق."},{"en":"Thank you very much.","ar":"شكراً جزيلاً."},{"en":"You are welcome.","ar":"عفواً، على الرحب والسعة."}],"exercises":[{"ar":"أين المستشفى","en":"Where is the hospital"},{"ar":"انعطف يميناً","en":"Turn right"},{"ar":"إنه قريب من هنا","en":"It is near here"}]},{"id":"b4","kind":"situation","level":"beginner","title":"في المتجر","situation":"السؤال عن السعر والدفع","lines":[{"en":"How much is this shirt?","ar":"كم سعر هذا القميص؟"},{"en":"It is too expensive.","ar":"إنه غالٍ جداً."},{"en":"Do you have a smaller size?","ar":"هل لديكم مقاس أصغر؟"},{"en":"I will take it.","ar":"سآخذه."},{"en":"Can I pay by card?","ar":"هل يمكنني الدفع بالبطاقة؟"},{"en":"Here is your change.","ar":"تفضل الباقي."}],"exercises":[{"ar":"كم سعر هذا القميص","en":"How much is this shirt"},{"ar":"هل يمكنني الدفع نقداً","en":"Can I pay in cash"},{"ar":"إنه رخيص جداً","en":"It is very cheap"}]},{"id":"b5","kind":"situation","level":"beginner","title":"العائلة","situation":"الحديث عن أفراد عائلتك","lines":[{"en":"This is my family.","ar":"هذه عائلتي."},{"en":"I have two brothers and one sister.","ar":"لدي أخوان وأخت واحدة."},{"en":"My father is a teacher.","ar":"أبي معلم."},{"en":"My mother cooks very well.","ar":"أمي تطبخ جيداً."},{"en":"We eat together every Friday.","ar":"نأكل معاً كل جمعة."},{"en":"I love my family.","ar":"أحب عائلتي."}],"exercises":[{"ar":"أبي يعمل في بنك","en":"My father works in a bank"},{"ar":"لدي أخت واحدة","en":"I have one sister"},{"ar":"نحن نحب بيتنا","en":"We love our house"}]},{"id":"b6","kind":"situation","level":"beginner","title":"الوقت والمواعيد","situation":"السؤال عن الوقت وتحديد موعد","lines":[{"en":"What time is it?","ar":"كم الساعة؟"},{"en":"It is half past three.","ar":"الساعة الثالثة والنصف."},{"en":"What time does the class start?","ar":"متى يبدأ الدرس؟"},{"en":"It starts at eight o'clock.","ar":"يبدأ في الثامنة."},{"en":"Can we meet tomorrow?","ar":"هل يمكننا اللقاء غداً؟"},{"en":"Sorry, I am busy on Friday.","ar":"آسف، أنا مشغول يوم الجمعة."}],"exercises":[{"ar":"كم الساعة الآن","en":"What time is it now"},{"ar":"أراك غداً في الصباح","en":"See you tomorrow morning"},{"ar":"أنا مشغول اليوم","en":"I am busy today"}]},{"id":"b7","kind":"situation","level":"beginner","title":"الطقس","situation":"الحديث عن الطقس","lines":[{"en":"It is very hot today.","ar":"الجو حار جداً اليوم."},{"en":"It is cold in the morning.","ar":"الجو بارد في الصباح."},{"en":"It is raining now.","ar":"تمطر الآن."},{"en":"Take an umbrella with you.","ar":"خذ مظلة معك."},{"en":"What is the weather like tomorrow?","ar":"كيف سيكون الطقس غداً؟"},{"en":"I like sunny days.","ar":"أحب الأيام المشمسة."}],"exercises":[{"ar":"الجو بارد اليوم","en":"It is cold today"},{"ar":"هل تمطر الآن","en":"Is it raining now"},{"ar":"أحب الطقس الحار","en":"I like hot weather"}]},{"id":"i1","kind":"situation","level":"intermediate","title":"مقابلة عمل","situation":"التحدث بثقة أمام مدير التوظيف","lines":[{"en":"Thank you for inviting me to this interview.","ar":"شكراً لدعوتي إلى هذه المقابلة."},{"en":"I have three years of experience in sales.","ar":"لدي ثلاث سنوات خبرة في المبيعات."},{"en":"I am good at working in a team.","ar":"أجيد العمل ضمن فريق."},{"en":"Could you tell me more about the role?","ar":"هل يمكنك إخباري المزيد عن الوظيفة؟"},{"en":"When would I be able to start?","ar":"متى يمكنني أن أبدأ؟"},{"en":"I look forward to hearing from you.","ar":"أتطلع إلى سماع ردكم."}],"exercises":[{"ar":"لدي خبرة في التسويق","en":"I have experience in marketing"},{"ar":"هل يمكنك أن تخبرني عن الراتب","en":"Could you tell me about the salary"},{"ar":"أتطلع إلى العمل معكم","en":"I look forward to working with you"}]},{"id":"i2","kind":"situation","level":"intermediate","title":"في المطار","situation":"تسجيل الحقائب والبحث عن البوابة","lines":[{"en":"Where is the check-in desk for this flight?","ar":"أين مكتب التسجيل لهذه الرحلة؟"},{"en":"I would like a window seat, please.","ar":"أريد مقعداً بجانب النافذة من فضلك."},{"en":"I have one bag to check in.","ar":"لدي حقيبة واحدة لتسجيلها."},{"en":"Has the flight been delayed?","ar":"هل تأخرت الرحلة؟"},{"en":"My flight leaves at nine o'clock.","ar":"رحلتي تقلع في التاسعة."},{"en":"Which gate should I go to?","ar":"إلى أي بوابة يجب أن أذهب؟"}],"exercises":[{"ar":"رحلتي تقلع في العاشرة","en":"My flight leaves at ten o'clock"},{"ar":"هل يمكنني تغيير مقعدي","en":"Can I change my seat"},{"ar":"أين بوابة الصعود","en":"Where is the boarding gate"}]},{"id":"i3","kind":"situation","level":"intermediate","title":"عند الطبيب","situation":"وصف الأعراض بدقة","lines":[{"en":"I have had a headache since yesterday.","ar":"أعاني من صداع منذ أمس."},{"en":"I think I have a fever.","ar":"أظن أن لدي حمى."},{"en":"Should I take any medicine?","ar":"هل يجب أن أتناول أي دواء؟"},{"en":"How often should I take it?","ar":"كم مرة يجب أن أتناوله؟"},{"en":"I am allergic to penicillin.","ar":"لدي حساسية من البنسلين."},{"en":"I feel much better now.","ar":"أشعر بتحسن كبير الآن."}],"exercises":[{"ar":"أعاني من ألم في ظهري","en":"I have a pain in my back"},{"ar":"لدي موعد مع الدكتور","en":"I have an appointment with the doctor"},{"ar":"كم مرة يجب أن أتناول الدواء","en":"How often should I take the medicine"}]},{"id":"i4","kind":"situation","level":"intermediate","title":"في الفندق","situation":"الحجز وحل المشكلات","lines":[{"en":"I have a reservation under the name Ahmed.","ar":"لدي حجز باسم أحمد."},{"en":"Is breakfast included?","ar":"هل الإفطار مشمول؟"},{"en":"Could I have a room with a view?","ar":"هل يمكنني الحصول على غرفة مطلة؟"},{"en":"What time is check-out?","ar":"متى موعد المغادرة؟"},{"en":"The air conditioner is not working.","ar":"المكيف لا يعمل."},{"en":"Could you call a taxi for me?","ar":"هل يمكنك طلب سيارة أجرة لي؟"}],"exercises":[{"ar":"هل الإفطار مشمول","en":"Is breakfast included"},{"ar":"متى موعد تسجيل الوصول","en":"What time is check-in"},{"ar":"الإنترنت لا يعمل","en":"The internet is not working"}]},{"id":"i5","kind":"situation","level":"intermediate","title":"مكالمة هاتفية","situation":"التحدث بأدب عبر الهاتف","lines":[{"en":"Hello, this is Sara speaking.","ar":"مرحباً، معك سارة."},{"en":"May I speak to Mr. Ali, please?","ar":"هل يمكنني التحدث إلى السيد علي؟"},{"en":"I am afraid he is not available.","ar":"أخشى أنه غير متاح."},{"en":"Could you take a message?","ar":"هل يمكنك تدوين رسالة؟"},{"en":"I will call back later.","ar":"سأعاود الاتصال لاحقاً."},{"en":"Sorry, the line is bad.","ar":"آسف، الخط سيئ."}],"exercises":[{"ar":"هل يمكنني ترك رسالة","en":"Can I leave a message"},{"ar":"سأعاود الاتصال غداً","en":"I will call back tomorrow"},{"ar":"الخط سيئ","en":"The line is bad"}]},{"id":"i6","kind":"situation","level":"intermediate","title":"في البنك","situation":"فتح حساب وسحب المال","lines":[{"en":"I would like to open an account.","ar":"أود فتح حساب."},{"en":"What documents do I need?","ar":"ما المستندات التي أحتاجها؟"},{"en":"I want to withdraw some money.","ar":"أريد سحب بعض المال."},{"en":"Is there a fee for this service?","ar":"هل هناك رسوم لهذه الخدمة؟"},{"en":"Could you check my balance, please?","ar":"هل يمكنك التحقق من رصيدي من فضلك؟"},{"en":"I lost my card yesterday.","ar":"فقدت بطاقتي أمس."}],"exercises":[{"ar":"أريد فتح حساب جديد","en":"I want to open a new account"},{"ar":"هل هناك رسوم","en":"Is there a fee"},{"ar":"أريد تحويل بعض المال","en":"I want to transfer some money"}]},{"id":"i7","kind":"situation","level":"intermediate","title":"تقديم شكوى","situation":"التعبير عن مشكلة بأدب","lines":[{"en":"Excuse me, there is a problem with my order.","ar":"عفواً، هناك مشكلة في طلبي."},{"en":"I ordered this two days ago.","ar":"طلبت هذا قبل يومين."},{"en":"It has not arrived yet.","ar":"لم يصل بعد."},{"en":"Could you check it for me?","ar":"هل يمكنك التحقق منه لي؟"},{"en":"I would like a refund, please.","ar":"أريد استرداد المبلغ من فضلك."},{"en":"Thank you for your understanding.","ar":"شكراً على تفهمكم."}],"exercises":[{"ar":"هناك مشكلة في طلبي","en":"There is a problem with my order"},{"ar":"أريد استرداد المبلغ","en":"I would like a refund"},{"ar":"لم يصل الطلب بعد","en":"The order has not arrived yet"}]},{"id":"g1","kind":"grammar","level":"beginner","title":"فعل الكينونة: am / is / are","situation":"أهم قاعدة في الإنجليزية","lines":[{"en":"I am happy.","ar":"أنا سعيد."},{"en":"She is a doctor.","ar":"هي طبيبة."},{"en":"We are at home.","ar":"نحن في البيت."},{"en":"Are you ready?","ar":"هل أنت جاهز؟"}],"exercises":[{"ar":"هم في المدرسة","en":"They are at school"},{"ar":"هو ليس متعباً","en":"He is not tired"},{"ar":"هل هي معلمة","en":"Is she a teacher"}],"explain":"في العربية نقول \"أنا طالب\" بدون فعل. أما الإنجليزية فلا تقبل جملة بدون فعل، فنضع am أو is أو are بحسب الفاعل:\n\nI am\nYou are\nHe is\nShe is\nIt is\nWe are\nThey are\n\nللنفي نضيف not بعد الفعل، وللسؤال نقدّم الفعل على الفاعل:\n\nShe is not tired.\nAre you ready?\n\nلا نضع am قبل فعل عادي في المضارع البسيط. وهذا خطأ شائع:\n\nI am go to school."},{"id":"g2","kind":"grammar","level":"beginner","title":"الأدوات: a / an / the","situation":"متى نستخدم كل واحدة","lines":[{"en":"I have a car.","ar":"لدي سيارة."},{"en":"She eats an apple.","ar":"هي تأكل تفاحة."},{"en":"The car is red.","ar":"السيارة حمراء."},{"en":"He is an engineer.","ar":"هو مهندس."}],"exercises":[{"ar":"أريد برتقالة","en":"I want an orange"},{"ar":"هو يملك كتاباً","en":"He has a book"},{"ar":"الكتاب على الطاولة","en":"The book is on the table"}],"explain":"في العربية \"ال\" للتعريف فقط، ولا شيء للنكرة. أما الإنجليزية ففيها ثلاث أدوات.\n\nنستخدم a قبل اسم مفرد عام يبدأ بصوت ساكن:\n\na book\n\nونستخدم an قبل اسم مفرد عام يبدأ بصوت متحرك:\n\nan apple\n\nونستخدم the لشيء معروف للمتكلم والسامع:\n\nthe book on the table\n\nالعبرة بالصوت وليس بالحرف:\n\nan hour\na university\n\nونستخدم a وan مع المهن أيضاً:\n\nHe is a pilot."},{"id":"g3","kind":"grammar","level":"beginner","title":"المضارع البسيط","situation":"العادات والحقائق","lines":[{"en":"I drink tea every morning.","ar":"أشرب الشاي كل صباح."},{"en":"She works in a bank.","ar":"هي تعمل في بنك."},{"en":"He watches TV at night.","ar":"هو يشاهد التلفاز ليلاً."},{"en":"They study English.","ar":"هم يدرسون الإنجليزية."}],"exercises":[{"ar":"هو يعمل في مستشفى","en":"He works in a hospital"},{"ar":"أنا أشرب القهوة كل يوم","en":"I drink coffee every day"},{"ar":"هي تدرس الإنجليزية","en":"She studies English"}],"explain":"نستخدم المضارع البسيط للعادات والحقائق. الفعل يبقى كما هو، إلا مع he وshe وit فنضيف s في آخره:\n\nI work\nYou work\nHe works\nShe works\nThey work\n\nالأفعال التي تنتهي بـ ch أو sh أو s أو x أو o نضيف لها es:\n\nShe watches TV.\nHe goes to work.\n\nوالفعل الذي ينتهي بحرف ساكن ثم y نحوّل y إلى ies:\n\nstudy\nstudies"},{"id":"g4","kind":"grammar","level":"beginner","title":"النفي والسؤال بـ do / does","situation":"في المضارع البسيط","lines":[{"en":"I don't like coffee.","ar":"لا أحب القهوة."},{"en":"She doesn't live here.","ar":"هي لا تسكن هنا."},{"en":"Do you speak English?","ar":"هل تتحدث الإنجليزية؟"},{"en":"Does he work today?","ar":"هل يعمل اليوم؟"}],"exercises":[{"ar":"هو لا يحب الشاي","en":"He doesn't like tea"},{"ar":"هل تسكن هنا","en":"Do you live here"},{"ar":"هي لا تعمل اليوم","en":"She doesn't work today"}],"explain":"للنفي والسؤال في المضارع البسيط نستخدم do وdoes. ولا نضع s على الفعل بعدهما لأن does حملتها:\n\nI do not like coffee.\nShe does not like coffee.\nDo you like coffee?\nDoes he like coffee?\n\nالاختصار المشهور:\n\ndon't\ndoesn't\n\nولا نستخدم do مع am وis وare. نقول:\n\nAre you tired?"},{"id":"g5","kind":"grammar","level":"beginner","title":"الجمع","situation":"من المفرد إلى الجمع","lines":[{"en":"I have two brothers.","ar":"لدي أخوان."},{"en":"There are three buses.","ar":"هناك ثلاث حافلات."},{"en":"The children are in the garden.","ar":"الأطفال في الحديقة."},{"en":"These women are teachers.","ar":"هؤلاء النساء معلمات."}],"exercises":[{"ar":"لدي ثلاثة كتب","en":"I have three books"},{"ar":"الأطفال في البيت","en":"The children are at home"},{"ar":"هناك خمس مدن","en":"There are five cities"}],"explain":"الجمع في الإنجليزية غالباً بإضافة s إلى آخر الاسم:\n\none book\ntwo books\n\nإن انتهى الاسم بـ s أو sh أو ch أو x نضيف es:\n\nbus\nbuses\nbox\nboxes\n\nوإن انتهى بـ y بعد حرف ساكن نحوّلها إلى ies:\n\ncity\ncities\n\nوهناك جموع شاذة يجب حفظها:\n\nman\nmen\nwoman\nwomen\nchild\nchildren\nperson\npeople\n\nبعد أي رقم أكبر من واحد نستخدم الجمع دائماً:\n\ntwo books"},{"id":"g6","kind":"grammar","level":"beginner","title":"ضمائر الملكية","situation":"my / your / his / her","lines":[{"en":"This is my phone.","ar":"هذا هاتفي."},{"en":"Her brother is a doctor.","ar":"أخوها طبيب."},{"en":"We love our teacher.","ar":"نحب معلمنا."},{"en":"Their house is big.","ar":"بيتهم كبير."}],"exercises":[{"ar":"هذا كتابي","en":"This is my book"},{"ar":"أخوه في المدرسة","en":"His brother is at school"},{"ar":"بيتنا قريب","en":"Our house is near"}],"explain":"نستخدم هذه الكلمات قبل الاسم للدلالة على الملكية:\n\nmy book\nyour book\nhis book\nher book\nour book\ntheir book\n\nانتبه: his للمالك المذكر وher للمالكة المؤنثة، بحسب المالك وليس بحسب الشيء المملوك.\n\nونستخدم its لغير العاقل:\n\nThe cat likes its food.\n\nوفي العربية الضمير يلتصق بالاسم (كتابي)، أما في الإنجليزية فهو كلمة مستقلة قبله."},{"id":"g7","kind":"grammar","level":"beginner","title":"القدرة بـ can","situation":"ما أستطيع وما لا أستطيع","lines":[{"en":"I can swim.","ar":"أستطيع السباحة."},{"en":"She can speak English.","ar":"هي تستطيع التحدث بالإنجليزية."},{"en":"I can't drive.","ar":"لا أستطيع القيادة."},{"en":"Can you help me?","ar":"هل تستطيع مساعدتي؟"}],"exercises":[{"ar":"هو يستطيع القراءة","en":"He can read"},{"ar":"لا أستطيع الغناء","en":"I can't sing"},{"ar":"هل تستطيع الدخول","en":"Can you come in"}],"explain":"نستخدم can للتعبير عن القدرة أو الإذن. وبعده الفعل بصورته الأصلية دون to ودون s:\n\nI can swim.\nShe can speak English.\n\nللنفي can't أو cannot، وللسؤال نقدّم can على الفاعل:\n\nI can't drive.\nCan you help me?\n\nوالخطأ الشائع الذي يجب تجنّبه:\n\nDo you can help me?"},{"id":"g8","kind":"grammar","level":"beginner","title":"حروف الجر: in / on / at","situation":"للزمن وللمكان","lines":[{"en":"The class starts at nine.","ar":"يبدأ الدرس في التاسعة."},{"en":"I have a meeting on Monday.","ar":"لدي اجتماع يوم الاثنين."},{"en":"She was born in 2000.","ar":"ولدت عام 2000."},{"en":"The keys are on the table.","ar":"المفاتيح على الطاولة."}],"exercises":[{"ar":"أنا في الغرفة","en":"I am in the room"},{"ar":"لدي موعد يوم الجمعة","en":"I have an appointment on Friday"},{"ar":"نبدأ في الثامنة","en":"We start at eight"}],"explain":"ثلاثة حروف جر تربك الجميع. أولاً للزمن.\n\nللساعة نستخدم at:\n\nat 5 o'clock\n\nولليوم والتاريخ نستخدم on:\n\non Monday\n\nوللشهر والسنة والفصل نستخدم in:\n\nin May\nin 2026\nin summer\n\nثانياً للمكان.\n\nلنقطة محددة نستخدم at:\n\nat the door\n\nوفوق سطح نستخدم on:\n\non the table\n\nوداخل شيء نستخدم in:\n\nin the room"},{"id":"g9","kind":"grammar","level":"intermediate","title":"الماضي البسيط","situation":"أحداث انتهت في الماضي","lines":[{"en":"I visited my uncle yesterday.","ar":"زرت عمي أمس."},{"en":"She bought a new phone.","ar":"اشترت هاتفاً جديداً."},{"en":"We didn't see the movie.","ar":"لم نشاهد الفيلم."},{"en":"Did you finish the work?","ar":"هل أنهيت العمل؟"}],"exercises":[{"ar":"ذهبنا إلى السوق أمس","en":"We went to the market yesterday"},{"ar":"هو لم يأتِ إلى العمل","en":"He didn't come to work"},{"ar":"هل رأيت أخي","en":"Did you see my brother"}],"explain":"نستخدم الماضي البسيط لأحداث انتهت في وقت محدد من الماضي. الأفعال المنتظمة نضيف لها ed:\n\nwork\nworked\nplay\nplayed\n\nوالأفعال الشاذة يجب حفظها:\n\ngo\nwent\nsee\nsaw\nhave\nhad\nbuy\nbought\n\nللنفي والسؤال نستخدم did، ويعود الفعل لصورته الأصلية:\n\nI didn't go there.\nDid you see him?\n\nوالخطأ الشائع الذي يجب تجنّبه:\n\nI didn't went there."},{"id":"g10","kind":"grammar","level":"intermediate","title":"المضارع المستمر","situation":"ما يحدث الآن","lines":[{"en":"I am studying English now.","ar":"أدرس الإنجليزية الآن."},{"en":"They are playing football.","ar":"هم يلعبون كرة القدم."},{"en":"He is reading a newspaper.","ar":"هو يقرأ جريدة."},{"en":"She is cooking dinner.","ar":"هي تطبخ العشاء."}],"exercises":[{"ar":"هي تتكلم مع صديقتها الآن","en":"She is talking to her friend now"},{"ar":"نحن نأكل الغداء","en":"We are eating lunch"},{"ar":"هو ينتظر الحافلة","en":"He is waiting for the bus"}],"explain":"المضارع المستمر لما يحدث الآن أو في هذه الفترة. نكوّنه من am أو is أو are ثم الفعل مع ing:\n\nI am working now.\nShe is reading a book.\n\nأما المضارع البسيط فللعادات والحقائق:\n\nI work every day.\n\nوهناك أفعال لا تأتي عادةً في الاستمرار، مثل know وlike وwant. نقول:\n\nI know the answer.\n\nولا نقول:\n\nI am knowing the answer."},{"id":"g11","kind":"grammar","level":"intermediate","title":"المستقبل: will / going to","situation":"التخطيط والتوقع","lines":[{"en":"I will call you later.","ar":"سأتصل بك لاحقاً."},{"en":"I am going to study medicine.","ar":"سأدرس الطب، وهذه خطتي."},{"en":"It will be sunny tomorrow.","ar":"سيكون الجو مشمساً غداً."},{"en":"They won't come today.","ar":"لن يأتوا اليوم."}],"exercises":[{"ar":"سأساعدك غداً","en":"I will help you tomorrow"},{"ar":"سنسافر الأسبوع القادم","en":"We are going to travel next week"},{"ar":"لن أتأخر","en":"I won't be late"}],"explain":"نستخدم will للقرارات اللحظية والتوقعات والوعود:\n\nI will help you.\nIt will rain tomorrow.\n\nونستخدم am أو is أو are ثم going to للخطط المقررة سلفاً:\n\nI am going to travel next week.\n\nبعد will يأتي الفعل بصورته الأصلية:\n\nShe will come.\n\nوللنفي won't ومعناها will not:\n\nI won't be late."},{"id":"g12","kind":"grammar","level":"intermediate","title":"الماضي التام: have / has","situation":"يربط الماضي بالحاضر","lines":[{"en":"I have lived here for five years.","ar":"أسكن هنا منذ خمس سنوات."},{"en":"Have you ever been to London?","ar":"هل زرت لندن من قبل؟"},{"en":"She has already finished.","ar":"لقد أنهت بالفعل."},{"en":"We haven't eaten yet.","ar":"لم نأكل بعد."}],"exercises":[{"ar":"لقد أنهيت عملي","en":"I have finished my work"},{"ar":"هل زرت مصر من قبل","en":"Have you ever been to Egypt"},{"ar":"هو لم يصل بعد","en":"He hasn't arrived yet"}],"explain":"الماضي التام يربط الماضي بالحاضر: نتكلم عن خبرة، أو عن شيء بدأ في الماضي واستمر، أو له أثر الآن. نكوّنه من have أو has ثم التصريف الثالث للفعل:\n\nI have seen this movie.\nShe has finished her work.\n\nونستخدمه مع كلمات مثل for وsince وever وnever وalready وyet:\n\nI have lived here for five years.\nHave you ever been to London?\n\nلكن مع وقت محدد في الماضي نستخدم الماضي البسيط:\n\nI saw him yesterday.\n\nوهذا خطأ شائع بين العرب:\n\nI have seen him yesterday."},{"id":"g13","kind":"grammar","level":"intermediate","title":"المقارنة والتفضيل","situation":"أطول، أجمل، الأفضل","lines":[{"en":"My brother is taller than me.","ar":"أخي أطول مني."},{"en":"This phone is more expensive than that one.","ar":"هذا الهاتف أغلى من ذاك."},{"en":"She is the best student in the class.","ar":"هي أفضل طالبة في الصف."},{"en":"Today is worse than yesterday.","ar":"اليوم أسوأ من أمس."}],"exercises":[{"ar":"هذا الكتاب أفضل من ذاك","en":"This book is better than that one"},{"ar":"هي أصغر من أختها","en":"She is younger than her sister"},{"ar":"هذه أجمل مدينة","en":"This is the most beautiful city"}],"explain":"للمقارنة بين شيئين: الصفة القصيرة نضيف لها er ثم than:\n\ntall\ntaller than\n\nوالصفة الطويلة نضع قبلها more:\n\nmore expensive than\n\nللأفضل أو الأكبر نستخدم the مع est أو most:\n\nthe tallest\nthe most expensive\n\nوالشواذ يجب حفظها:\n\ngood\nbetter\nthe best\nbad\nworse\nthe worst\n\nولا نجمع الأسلوبين معاً. وهذا خطأ شائع:\n\nmore taller"},{"id":"g14","kind":"grammar","level":"intermediate","title":"الشرط الأول: if","situation":"ما سيحدث إن حدث شيء","lines":[{"en":"If it rains, we will stay home.","ar":"إذا أمطرت سنبقى في البيت."},{"en":"If you study, you will pass.","ar":"إذا درست فستنجح."},{"en":"I will call you if I am late.","ar":"سأتصل بك إذا تأخرت."},{"en":"If she comes, I will tell her.","ar":"إذا جاءت فسأخبرها."}],"exercises":[{"ar":"إذا ذهبت سأذهب معك","en":"If you go I will go with you"},{"ar":"إذا درست ستنجح","en":"If you study you will pass"},{"ar":"سأتصل بك إذا تأخرت","en":"I will call you if I am late"}],"explain":"الشرط الأول لأمر محتمل في المستقبل. نكوّنه من if ثم مضارع بسيط، ثم will مع الفعل:\n\nIf it rains, I will stay home.\nIf you study, you will pass.\n\nانتبه: بعد if لا نضع will. وهذا خطأ شائع:\n\nIf it will rain, I will stay home.\n\nوالصحيح:\n\nIf it rains, I will stay home."},{"id":"g15","kind":"grammar const $app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c === null || c === undefined || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const shuffle = a => { const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
function toast(msg){ const t=h('div',{class:'toast'},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }

function load(){ try{ const raw=localStorage.getItem('agaaEnglish'); if(raw) Object.assign(S, JSON.parse(raw)); }catch(e){} }
function save(){ try{ localStorage.setItem('agaaEnglish', JSON.stringify(S)); }catch(e){} }
function dayNum(d=new Date()){ return Math.floor((d.getTime() - d.getTimezoneOffset()*60000)/86400000); }
function markActivity(){
  const t = dayNum();
  if (S.lastDay === t) return;
  S.streak = (S.lastDay === t-1) ? S.streak+1 : 1;
  S.lastDay = t; save();
}
function streakNow(){ const t=dayNum(); return (S.lastDay===t||S.lastDay===t-1) ? S.streak : 0; }
const INTERVALS=[0,1,2,4,8,16];
function review(w, known){
  let box = (S.srs[w.key]||[0])[0];
  box = known ? Math.min(box+1, INTERVALS.length-1) : 0;
  S.srs[w.key] = [box, dayNum()+INTERVALS[box]]; save();
}
function dueWords(t, limit=10){
  const today=dayNum(), due=[], fresh=[];
  for (const w of t.words){ const s=S.srs[w.key]; if(!s) fresh.push(w); else if(s[1]<=today) due.push(w); }
  return [...due,...fresh].slice(0,limit);
}
const mastered = t => t.words.filter(w => (S.srs[w.key]||[0])[0] >= 3).length;

function say(text){
  try{
    if(!('speechSynthesis' in window)) { toast('النطق الصوتي غير متاح على هذا الجهاز'); return; }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate = S.slow ? 0.55 : 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){ try{ speechSynthesis.cancel(); }catch(e){} }

/** يسمعك مرة واحدة ويعيد النص. يرمي خطأً برسالة عربية إن تعذّر. */
async function listenOnce(){
  const cap = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.SpeechRecognition;
  if (cap){
    let av; try{ av = await cap.available(); }catch(e){ av = {available:false}; }
    if (!av.available) throw new Error('التعرف على الكلام غير متاح. ثبّت خدمات الكلام من Google على هاتفك.');
    let perm; try{ perm = await cap.requestPermissions(); }catch(e){ perm = {}; }
    if (perm.speechRecognition !== 'granted') throw new Error('اسمح للتطبيق باستخدام الميكروفون من إعدادات الهاتف ثم أعد المحاولة.');
    let r;
    try{ r = await cap.start({language:'en-US', maxResults:3, prompt:'', partialResults:false, popup:false}); }
    catch(e){ throw new Error('لم أسمع كلاماً واضحاً، حاول مرة أخرى'); }
    const m = r && r.matches && r.matches[0];
    if (!m) throw new Error('لم أسمع كلاماً واضحاً، حاول مرة أخرى');
    return m;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) throw new Error('التعرف على الكلام غير متاح في هذه النسخة. اكتب ردك بدلاً من ذلك.');
  return new Promise((res, rej)=>{
    const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
    r.onresult = e => res(e.results[0][0].transcript);
    r.onerror = e => rej(new Error('تعذّر التعرف على الصوت ('+e.error+')'));
    r.onend = () => rej(new Error('لم أسمع كلاماً واضحاً، حاول مرة أخرى'));
    try{ r.start(); }catch(e){ rej(new Error('تعذّر تشغيل الميكروفون')); }
  });
}

const keyW = s => s.replace(/'/g,'');
function ptokens(s){ return s.toLowerCase().replace(/[\u2019\u2018]/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(w=>keyW(w)); }
function alignMatch(target, heard){
  const n=target.length, m=heard.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let a=1;a<=n;a++) for(let b=1;b<=m;b++)
    dp[a][b] = keyW(target[a-1])===keyW(heard[b-1]) ? dp[a-1][b-1]+1 : Math.max(dp[a-1][b],dp[a][b-1]);
  const ok=new Array(n).fill(false); let a=n,b=m;
  while(a>0&&b>0){
    if(keyW(target[a-1])===keyW(heard[b-1])){ ok[a-1]=true; a--; b--; }
    else if(dp[a-1][b]>=dp[a][b-1]) a--; else b--;
  }
  return ok;
}
function pronounceSheet(target){
  const display = target.split(' ').filter(w=>w.trim());
  const tt=[], owner=[];
  display.forEach((w,i)=>ptokens(w).forEach(t=>{ tt.push(t); owner.push(i); }));
  const wordEls = display.map((w,i)=>h('span',{class:'wchip',style:'border:0;background:none;font-size:24px;font-weight:600',onclick:()=>say(w.replace(/[^A-Za-z']/g,''))},w));
  const heardEl = h('div',{class:'center en',style:'font-size:18px;margin-top:6px'});
  const verdict = h('div',{class:'note',style:'display:none'});
  const errEl = h('div',{class:'note',style:'display:none;background:var(--bad-bg)'});
  const mic = h('button',{class:'btn'},'🎤 اضغط وتحدث');
  let busy=false;
  mic.onclick = async ()=>{
    if(busy) return; busy=true; mic.textContent='🎧 أستمع إليك...'; errEl.style.display='none'; verdict.style.display='none'; heardEl.textContent='';
    stopSay();
    try{
      const text = await listenOnce();
      heardEl.textContent = '« '+text+' »';
      const m = alignMatch(tt, ptokens(text));
      const res = display.map(()=>null); let good=0;
      m.forEach((v,k)=>{ if(v) good++; res[owner[k]] = (res[owner[k]]===null?true:res[owner[k]]) && v; });
      wordEls.forEach((el,i)=>{ el.classList.remove('w-ok','w-bad'); if(res[i]===true) el.classList.add('w-ok'); else if(res[i]===false) el.classList.add('w-bad'); });
      const pct = m.length ? Math.round(100*good/m.length) : 0;
      verdict.style.display='block';
      verdict.textContent = pct===100 ? 'ممتاز! نطقك واضح، وسُمعت كل الكلمات ✓'
        : pct>=70 ? `جيد (${pct}%). الكلمات الحمراء لم تُسمع بوضوح، اضغط عليها لتسمعها ثم أعد المحاولة.`
        : `حاول مرة أخرى ببطء ووضوح (${pct}%). استمع للنطق الصحيح أولاً.`;
    }catch(e){ errEl.style.display='block'; errEl.textContent=e.message; }
    busy=false; mic.textContent='🎤 اضغط وتحدث';
  };
  sheet([
    h('h2',null,'انطق الجملة'),
    h('div',{class:'words',style:'gap:10px'},wordEls),
    h('button',{class:'btn tonal',onclick:()=>say(target)},'🔊 استمع للنطق الصحيح'),
    mic, heardEl, verdict, errEl,
    h('div',{class:'muted center',style:'font-size:12px;margin-top:12px'},'التقييم يعتمد على خدمة التعرف على الكلام في هاتفك. يدل على وضوح نطقك للكلمات، وليس على لكنتك.')
  ]);
}

function lessonScreen(lesson){
  const steps=[];
  if (lesson.explain) steps.push({t:'explain'});
  lesson.lines.forEach(l=>steps.push({t:'line',l}));
  (lesson.exercises||[]).forEach(e=>steps.push({t:'build',e}));
  let i=0;
  const next = ()=>{ i++; draw(); };
  function draw(){
    if (i>=steps.length){
      if(!S.done.includes(lesson.id)) S.done.push(lesson.id);
      markActivity(); save();
      screen(lesson.title,[h('div',{class:'center',style:'padding:40px 10px'},
        h('div',{style:'font-size:64px'},'🏆'),h('h2',null,'أحسنت! أنهيت الدرس'),
        h('p',{class:'muted'},'🔥 أيام متتالية: '+streakNow()),
        h('button',{class:'btn',onclick:back},'رجوع إلى الدروس'))]);
      return;
    }
    const s=steps[i];
    const prog=h('div',{class:'prog',style:'margin-bottom:12px'},h('i',{style:`width:${100*i/steps.length}%`}));
    let body;
    if (s.t==='explain'){
      body=[prog,h('div',{class:'card'},h('div',{style:'font-weight:700;margin-bottom:8px'},'الفكرة'),h('pre',{class:'explain'},lesson.explain)),
        h('button',{class:'btn',onclick:next},'ابدأ التدريب')];
    } else if (s.t==='line'){
      say(s.l.en);
      body=[prog,h('div',{class:'card center',style:'padding:26px 14px'},
        h('div',{class:'en center',style:'font-size:26px;font-weight:700'},s.l.en),
        h('div',{class:'muted',style:'margin-top:10px;font-size:18px'},s.l.ar)),
        h('button',{class:'btn tonal',onclick:()=>say(s.l.en)},'🔊 استمع للجملة'),
        h('button',{class:'btn outline',onclick:()=>pronounceSheet(s.l.en)},'🎤 انطق الجملة'),
        h('button',{class:'btn',onclick:next},'التالي')];
    } else {
      body=[prog,buildStep(s.e,next)];
    }
    screen(lesson.title,body);
  }
  draw();
}
function buildStep(ex, onNext){
  const words=ex.en.split(' ');
  let bank=shuffle(words.map((_,k)=>k));
  if(words.length>1 && bank.every((v,k)=>v===k)) bank.reverse();
  const chosen=[]; let ok=null;
  const wrap=h('div');
  const draw=()=>{
    const complete=bank.length===0;
    wrap.replaceChildren(...[
      h('div',{class:'center muted'},'رتّب الكلمات لتكوّن الجملة:'),
      h('div',{class:'center',style:'font-size:24px;font-weight:700;margin-top:6px'},ex.ar),
      h('div',{class:'wbox'},h('div',{class:'words'},chosen.map(k=>h('button',{class:'wchip',onclick:()=>{chosen.splice(chosen.indexOf(k),1);bank.push(k);ok=null;draw();}},words[k])))),
      h('div',{class:'words'},bank.map(k=>h('button',{class:'wchip',onclick:()=>{bank.splice(bank.indexOf(k),1);chosen.push(k);ok=null;draw();}},words[k]))),
      ok===true?h('div',{class:'center w-ok',style:'font-size:18px;margin-top:16px'},'أحسنت! جملة صحيحة ✓'):null,
      ok===false?h('div',{class:'center w-bad',style:'margin-top:16px;text-decoration:none'},'ليست صحيحة بعد، أعد الترتيب وحاول مرة أخرى'):null,
      ok===true?h('button',{class:'btn',onclick:onNext},'التالي')
        :h('button',{class:'btn',disabled:!complete,onclick:()=>{ ok = chosen.map(k=>words[k]).join(' ')===ex.en; if(ok) say(ex.en); draw(); }},'تحقق')].filter(Boolean));
  };
  draw(); return wrap;
}

const FILL=new Set(['well','um','uh','oh','ah','hmm','please','just','a','an','the']);
function norm(s){
  let t=s.toLowerCase().replace(/[\u2019\u2018]/g,"'");
  t=t.replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/\blet's\b/g,'let us')
     .replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is');
  t=t.replace(/\bthanks a lot\b/g,'thank you').replace(/\bthank you (very|so) much\b/g,'thank you').replace(/\bthanks\b/g,'thank you').replace(/\bokay\b/g,'ok').replace(/\bgoodbye\b/g,'bye');
  t=t.replace(/-/g,'').replace(/[^a-z0-9* ]/g,' ');
  return t.split(/\s+/).filter(w=>w&&!FILL.has(w)).join(' ');
}
function lcs(a,b){ const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  return dp[a.length][b.length]; }
function replyMatches(user, accepts){
  const u=norm(user); if(!u) return false; const ut=u.split(' ');
  for(const a of accepts){
    const an=norm(a); if(!an) continue;
    if(an.includes('*')){
      const pat='^'+an.split(' ').map(w=>w==='*'?'\\S+(?: \\S+){0,9}':w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join(' ')+'$';
      if(new RegExp(pat).test(u)) return true; continue; }
    if(u===an) return true;
    const at=an.split(' ');
    if(ut.length<=at.length+3 && (' '+u+' ').includes(' '+an+' ')) return true;
    if(lcs(ut,at)/Math.max(ut.length,at.length)>=0.8) return true;
  }
  return false;
}

      h('button',{class:'btn',onclick:restart},'🔁 أعد المحادثة')));
    counter.textContent=Math.min(turn+(finished?0:1),c.turns.length)+'/'+c.turns.length;
    actions.style.display=inputrow.style.display=finished?'none':'';
    list.scrollTop=list.scrollHeight+500;
  }
  function ask(){ const t=c.turns[turn]; attempts=0; helped=false; msgs.push({text:t.them,ar:t.ar,me:false}); say(t.them); }
  function nextTurn(){ if(turn+1>=c.turns.length){ finished=true; if(score>(S.chatbest[c.id]||0)) S.chatbest[c.id]=score; markActivity(); save(); msgs.push({text:'انتهت المحادثة. Goodbye!',me:false}); say('Goodbye!'); } else { turn++; ask(); } }
  function send(){
    if(finished) return; const text=input.value.trim(); if(!text) return; input.value=''; const t=c.turns[turn];
    if(replyMatches(text,t.ok)){ msgs.push({text,me:true,st:1}); if(attempts===0&&!helped) score++; nextTurn(); }
    else { attempts++; msgs.push({text,me:true,st:2});
      if(attempts===1) msgs.push({note:true,text:'هذا الرد لا يناسب السؤال. تلميح: '+t.hint});
      else { const shown=t.ok.filter(a=>!a.includes('*')).slice(0,3); msgs.push({note:true,text:'ما زال غير مناسب. من الردود الصحيحة:\n'+(shown.length?shown:[showEx(t.ex)]).join('\n')}); } }
    paint();
  }
  function suggest(){ helped=true; msgs.push({note:true,text:'رد مقترح:\n'+showEx(c.turns[turn].ex)}); paint(); }
  function skip(){ msgs.push({note:true,text:'تخطّيت هذا السؤال. الرد المناسب كان: '+showEx(c.turns[turn].ex)}); nextTurn(); paint(); }
  function restart(){ msgs.length=0; turn=0; score=0; finished=false; ask(); paint(); }
  async function mic(){
    if(busy||finished) return; busy=true; micBtn.textContent='🎧'; stopSay();
    try{ input.value = await listenOnce(); input.focus(); }catch(e){ toast(e.message); }
    busy=false; micBtn.textContent='🎤';
  }
  $app.replaceChildren(bar,list,actions,inputrow);
  ask(); paint();
}

// ------------------------------------------------------------------ الترجمة
function translateScreen(){
  const src=h('textarea',{class:'tr',placeholder:'اكتب نصاً بالعربية أو الإنجليزية...'});
  const out=h('div'); let dir='auto';
  const seg=h('div',{class:'seg'});
  const drawSeg=()=>seg.replaceChildren(...[['auto','تلقائي'],['ar|en','عربي ← إنجليزي'],['en|ar','إنجليزي ← عربي']].map(([v,t])=>h('button',{class:dir===v?'on':'',onclick:()=>{dir=v;drawSeg();}},t)));
  drawSeg();
  const go1=async()=>{
    const q=src.value.trim(); if(!q) return;
    let pair=dir; if(dir==='auto') pair=/[\u0600-\u06FF]/.test(q)?'ar|en':'en|ar';
    out.replaceChildren(h('div',{class:'center muted'},'جارٍ الترجمة...'));
    try{
      const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q.slice(0,480))+'&langpair='+encodeURIComponent(pair));
      const j=await r.json(); const tx=(j.responseData&&j.responseData.translatedText)||'';
      if(!tx) throw new Error('empty');
      const toEn=pair==='ar|en';
      out.replaceChildren(h('div',{class:'card'},h('div',{class:toEn?'en':'',style:'font-size:20px'},tx),
        h('div',{class:'row',style:'margin-top:8px'},
          toEn?h('button',{class:'btn tonal small',onclick:()=>say(tx)},'🔊 استمع'):null,
          toEn?h('button',{class:'btn outline small',onclick:()=>pronounceSheet(tx)},'🎤 انطق'):null,
          h('button',{class:'btn tonal small',onclick:()=>{ try{navigator.clipboard.writeText(tx);toast('تم النسخ');}catch(e){} }},'نسخ'))));
    }catch(e){ out.replaceChildren(h('div',{class:'note',style:'background:var(--bad-bg)'},'تعذّرت الترجمة. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.')); }
  };
  screen('الترجمة',[seg,src,h('button',{class:'btn',onclick:go1},'ترجم'),h('div',{style:'margin-top:12px'},out),
    h('div',{class:'muted center',style:'font-size:12px;margin-top:10px'},'الترجمة تحتاج إنترنت (خدمة MyMemory المجانية، حتى 480 حرفاً).')]);
}

// ------------------------------------------------------------------ البدء
load(); applyTheme();
history.replaceState({d:0},'');
if (!S.level) { levelScreen(); stack.push(levelScreen); }
else stack.push(homeScreen);
if (S.level) render();
</script>
